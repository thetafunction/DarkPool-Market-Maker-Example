syntax = "proto3";

package mm.v1;

option go_package = "github.com/ThetaSpace/DarkPool-Market-Maker-Example/mm/v1;mmv1";

// Message is the unified wrapper for all WebSocket messages.
message Message {
  MessageType type = 1;
  int64 timestamp = 2;

  oneof payload {
    DepthSnapshot depth_snapshot = 3;
    QuoteRequest quote_request = 4;
    QuoteResponse quote_response = 5;
    QuoteReject quote_reject = 6;
    Heartbeat heartbeat = 7;
    Error error = 8;
    ConnectionAck connection_ack = 9;
    DepthSnapshotBatch depth_snapshot_batch = 10;
  }
}

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  MESSAGE_TYPE_REGISTER = 1;
  MESSAGE_TYPE_REGISTER_ACK = 2;
  MESSAGE_TYPE_DEPTH_SNAPSHOT = 3;
  MESSAGE_TYPE_QUOTE_REQUEST = 4;
  MESSAGE_TYPE_QUOTE_RESPONSE = 5;
  MESSAGE_TYPE_QUOTE_REJECT = 6;
  MESSAGE_TYPE_HEARTBEAT = 7;
  MESSAGE_TYPE_ERROR = 8;
  MESSAGE_TYPE_CONNECTION_ACK = 9;
  MESSAGE_TYPE_DEPTH_SNAPSHOT_BATCH = 10;
}

message ConnectionAck {
  bool success = 1;
  string session_id = 2;
  int64 server_time = 3;
  string mm_id = 4;
  ConnectionConfig config = 5;
  string error_message = 6;
  repeated string supported_versions = 7;
}

message ConnectionConfig {
  uint32 depth_push_interval_ms = 1;
  uint32 quote_timeout_ms = 2;
  uint32 heartbeat_interval_ms = 3;
}

message DepthSnapshot {
  uint64 chain_id = 1;
  string pair_id = 2;
  string mm_id = 3;
  string token_a = 4;
  string token_b = 5;
  repeated PriceLevel bids = 6;
  repeated PriceLevel asks = 7;
}

message PriceLevel {
  string price = 1;
  string amount = 2;
}

message DepthSnapshotBatch {
  repeated DepthSnapshot snapshots = 1;
}

// QuoteRequest is a stable envelope. The versioned body is serialized into
// quote_request_data and decoded based on protocol_version.
message QuoteRequest {
  string quote_id = 1;
  uint64 chain_id = 2;
  string mm_id = 3;
  string protocol_version = 4;
  bytes quote_request_data = 5;
}

// QuoteResponse is a stable envelope. The versioned MM quote is serialized into
// mm_quote_data and decoded based on protocol_version.
message QuoteResponse {
  string quote_id = 1;
  uint64 chain_id = 2;
  string mm_id = 3;
  QuoteStatus status = 4;
  string protocol_version = 5;
  bytes mm_quote_data = 6;
}

enum QuoteStatus {
  QUOTE_STATUS_UNSPECIFIED = 0;
  QUOTE_STATUS_SUCCESS = 1;
  QUOTE_STATUS_FAILED = 2;
}

message QuoteReject {
  string quote_id = 1;
  uint64 chain_id = 2;
  string mm_id = 3;
  RejectReason reason = 4;
  string message = 5;
}

enum RejectReason {
  REJECT_REASON_UNSPECIFIED = 0;
  REJECT_REASON_INSUFFICIENT_LIQUIDITY = 1;
  REJECT_REASON_PRICE_MOVED = 2;
  REJECT_REASON_PAIR_NOT_SUPPORTED = 3;
  REJECT_REASON_AMOUNT_TOO_SMALL = 4;
  REJECT_REASON_AMOUNT_TOO_LARGE = 5;
  REJECT_REASON_RATE_LIMITED = 6;
  REJECT_REASON_INTERNAL_ERROR = 7;
  REJECT_REASON_VERSION_NOT_SUPPORTED = 8;
}

message Heartbeat {
  bool ping = 1;
  bool pong = 2;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
  string related_quote_id = 3;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_MESSAGE = 1;
  ERROR_CODE_INVALID_SIGNATURE = 2;
  ERROR_CODE_TIMEOUT = 3;
  ERROR_CODE_INTERNAL = 4;
  ERROR_CODE_NOT_REGISTERED = 5;
  ERROR_CODE_DUPLICATE_REGISTER = 6;
  ERROR_CODE_UNAUTHORIZED = 7;
  ERROR_CODE_PAIR_NOT_WHITELISTED = 8;
  ERROR_CODE_RATE_LIMITED = 9;
}

message QuoteRequestV1 {
  string token_in = 1;
  string token_out = 2;
  string amount_in = 3;
  string executor = 4;
  int64 deadline = 5;
  string nonce = 6;
  string from = 7;
  string recipient = 8;
  ConfidenceExtractedValue confidence_extracted_value = 9;
}

message MMQuoteV1 {
  string maker = 1;
  string vault = 2;
  string executor = 3;
  string token_in = 4;
  string token_out = 5;
  string amount_in = 6;
  string amount_out = 7;
  string deadline = 8;
  string nonce = 9;
  ConfidenceExtractedValue confidence_extracted_value = 10;
  bytes extra_data = 11;
  bytes mm_signature = 12;
  string quote_id = 13;
}

message ConfidenceExtractedValue {
  string confidence_extracted_value_t = 1;
  string confidence_extracted_value_n = 2;
  string confidence_extracted_value_m = 3;
  string confidence_extracted_value_e = 4;
}
